# محلل ذكي | Smart Analyzer

بوت تحليل فني للأسواق.

## الأصول
- SPX
- NDX
- META
- DELL
- MU
- AMD
- MRNA
- TSLA
- SPCX

## التحليل
- الاتجاه: صاعد / هابط / عرضي
- الدعم الرئيسي
- المقاومة الرئيسية
- منطقة دخول CALL
- منطقة دخول PUT
- تأكيد بإغلاق شمعة 15 دقيقة
- الهدف الأول والثاني
- منطقة إلغاء السيناريو
- قوة الإشارة من 100

## فلتر السيولة
- متوسط حجم 20 شمعة
- Volume Ratio
- الحد الأدنى للسيولة: 1.20x
- السيولة القوية: 1.50x أو أعلى

> المشروع للتحليل فقط وليس توصية مالية.
