name: Smart Analyzer

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Smart Analyzer
        run: |
          python main.py
